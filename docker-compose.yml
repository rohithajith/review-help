version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: admin_db
    ports:
      # Map container 5432 to host 5433 to avoid conflicting with a host Postgres
      - '5433:5432'
    volumes:
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d admin_db -h localhost -p 5432"]
      interval: 5s
      retries: 10
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5002
      # Backend will connect to the Postgres container by service name 'postgres'
      ADMIN_DATABASE_URL: "postgres://appuser:password@postgres:5432/admin_db"
    ports:
      - '5002:5002'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      # Expose container port 80 on host 3002 (common dev/admin port)
      - '3002:80'
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
